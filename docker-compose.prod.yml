version: '3.8'

services:
  # PostgreSQL - Base de datos principal
  postgres:
    image: postgres:16-alpine
    container_name: learnmind_postgres_prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - learnmind_network
    restart: unless-stopped

  # MongoDB - Base de datos NoSQL
  mongodb:
    image: mongo:7.0
    container_name: learnmind_mongodb_prod
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongodb_data:/data/db
      - ./backend/scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - learnmind_network
    restart: unless-stopped

  # Redis - Caché y cola de trabajos
  redis:
    image: redis:7-alpine
    container_name: learnmind_redis_prod
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - learnmind_network
    restart: unless-stopped

  # MinIO - Almacenamiento de objetos
  minio:
    image: minio/minio:latest
    container_name: learnmind_minio_prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION_NAME: ${MINIO_REGION}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - learnmind_network
    restart: unless-stopped

  # MinIO Client Setup - Inicialización de buckets
  minio-init:
    image: minio/mc:latest
    container_name: learnmind_minio_init_prod
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do echo 'waiting for minio'; sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_DOCUMENTS};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_TEMP};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_RESULTS};
      /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET_DOCUMENTS};
      /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET_RESULTS};
      echo 'MinIO buckets created successfully';
      exit 0;
      "
    networks:
      - learnmind_network

  # Backend - NestJS API
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend.prod
    container_name: learnmind_backend_prod
    environment:
      NODE_ENV: production
      PORT: 3001
      
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_LOGGING: false
      DB_SYNCHRONIZE: false
      
      # MongoDB
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      
      # MinIO
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: ${MINIO_REGION}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS}
      MINIO_BUCKET_TEMP: ${MINIO_BUCKET_TEMP}
      MINIO_BUCKET_RESULTS: ${MINIO_BUCKET_RESULTS}
      MINIO_USE_SSL: false
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      
      # APIs
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL}
      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID}
      GOOGLE_CLOUD_CREDENTIALS_PATH: ${GOOGLE_CLOUD_CREDENTIALS_PATH}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      
      # SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_ENABLED: ${SMTP_ENABLED}
      SMTP_REJECT_UNAUTHORIZED: ${SMTP_REJECT_UNAUTHORIZED}
      
      # CORS
      CORS_ORIGIN: https://learnmind-ai.jkhoster.com
      
      # Features
      FEATURE_OCR_ENABLED: ${FEATURE_OCR_ENABLED}
      FEATURE_AUDIO_ENABLED: ${FEATURE_AUDIO_ENABLED}
      FEATURE_SUMMARIZE_ENABLED: ${FEATURE_SUMMARIZE_ENABLED}
      FEATURE_MINDMAP_ENABLED: ${FEATURE_MINDMAP_ENABLED}
      FEATURE_TRANSLATE_ENABLED: ${FEATURE_TRANSLATE_ENABLED}
      FEATURE_TTS_ENABLED: ${FEATURE_TTS_ENABLED}
      FEATURE_GROUPS_ENABLED: ${FEATURE_GROUPS_ENABLED}
      FEATURE_PAYMENTS_ENABLED: ${FEATURE_PAYMENTS_ENABLED}
    
    volumes:
      - ./backend/credentials:/app/credentials:ro
      - ./backend/scripts:/app/scripts:ro
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    
    networks:
      - learnmind_network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend - React + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend.prod
      args:
        VITE_BACKEND_URL: https://learnmind-ai.jkhoster.com
        VITE_WEBSOCKET_URL: wss://learnmind-ai.jkhoster.com
        VITE_API_URL: https://learnmind-ai.jkhoster.com/api
        VITE_APP_NAME: LearnMind AI
        VITE_APP_VERSION: 1.0.0
    container_name: learnmind_frontend_prod
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - learnmind_network
    restart: unless-stopped

  # Nginx - Reverse Proxy y SSL
  nginx:
    image: nginx:alpine
    container_name: learnmind_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
      - certbot_data:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - learnmind_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot - SSL Certificate Management
  certbot:
    image: certbot/certbot
    container_name: learnmind_certbot_prod
    volumes:
      - certbot_data:/var/www/certbot
      - ./nginx/ssl:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - learnmind_network

networks:
  learnmind_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  certbot_data:
    driver: local
